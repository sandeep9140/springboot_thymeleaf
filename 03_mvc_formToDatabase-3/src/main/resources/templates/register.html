<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{baseui :: mycommon(~{::section})}">

<head>
	<title>Common page</title>
</head>

<body>
	<section>

		<div class="container mt-4 ">
			<div class="row">
				<div class="col-md-6 offset-3 bg-primary">
					<form th:action="@{/save}" method="post" th:object="${stu}">
					  
						<div class="form-group">
						  <label for="exampleInputPassword1">Name</label>
						  <input type="password" th:field="*{name}" class="form-control" id="exampleInputPassword1">
						</div>
						<div class="form-group">
						  <label for="exampleInputPassword1">password</label>
						  <input type="password" th:field="*{password}"  class="form-control" id="exampleInputPassword1">
						</div>
						<div class="form-group">
						  <label for="exampleInputPassword1">contact</label>
						  <input type="password" th:field="*{contact}"  class="form-control" id="exampleInputPassword1">
						</div>
					  <div class="form-group">
					    <label for="exampleInputPassword1">email</label>
					    <input type="password" th:field="*{email}"  class="form-control" id="exampleInputPassword1">
					  </div>
					  <button type="submit" class="btn btn-primary">Submit</button>
					</form>
				</div>
			</div>

		</div>
	</section>
</body>

</html>
