<!DOCTYPE html>
<html lang="en" xmlns="https://www.thymeleaf.org">
	<head>
		<title>hello welcome</title>
	</head>
	
	<body>
		<h1>this my student page</h1>
		<table>
			<tr>
				
				<th>Name</th>
				<th>role</th>
				
			</tr>
			
			<tr th:each="s : ${emp}">
				<td th:text="${s.name}"></td>
				<td th:text="${s.role}"></td>
				<td th:if="${s.role}=='admin'"><button>Delete</button></td>
				<td th:unless="${s.role}=='user'"><button>View</button></td>
			</tr>
			
			
		</table>
	</body>
</html>
